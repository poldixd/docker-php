name: ci

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; serialize main-branch publications.
concurrency:
  group: php-images-${{ github.event_name == 'pull_request' && 'pr' || 'publish' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select image builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test build selection
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Select affected PHP versions
        id: select
        run: python3 -B .github/scripts/select_builds.py

  docker:
    name: PHP ${{ matrix.version }} (${{ matrix.variant }}, ${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        version: ${{ fromJSON(needs.changes.outputs.matrix).version }}
        variant: ${{ fromJSON(needs.changes.outputs.matrix).variant }}
        architecture: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        env:
          PHP_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$VARIANT" = "chromium" ]; then
            echo "TAG=$PHP_VERSION-chromium" >> "$GITHUB_OUTPUT"
            echo "INSTALL_CHROMIUM=true" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=$PHP_VERSION" >> "$GITHUB_OUTPUT"
            echo "INSTALL_CHROMIUM=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PUBLISH_IMAGES" = true ]; then
            echo 'OUTPUTS=type=image,name=poldixd/php,push-by-digest=true,name-canonical=true,push=true' >> "$GITHUB_OUTPUT"
          else
            echo 'OUTPUTS=type=cacheonly' >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test, and optionally push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: php/${{ matrix.version }}/Dockerfile
          target: test
          # Chromium smoke tests must run natively, not through QEMU.
          platforms: linux/${{ matrix.architecture }}
          pull: true
          outputs: ${{ steps.vars.outputs.OUTPUTS }}
          # Re-run tests even when the runtime layers are cached.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime,test' || 'test' }}
          build-args: |
            INSTALL_CHROMIUM=${{ steps.vars.outputs.INSTALL_CHROMIUM }}
          cache-from: type=gha,scope=php-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.architecture }}
          # Keep PR exports small; release builds also cache intermediate stages.
          cache-to: type=gha,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }},scope=php-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.architecture }}

      - name: Save tested image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCHITECTURE.txt"

      - name: Upload tested image digest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.vars.outputs.TAG }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish PHP ${{ matrix.version }} (${{ matrix.variant }})
    needs: [changes, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Compute image tag
        id: vars
        env:
          PHP_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          tag="$PHP_VERSION"
          if [ "$VARIANT" = chromium ]; then
            tag="$tag-chromium"
          fi
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"

      - name: Download tested image digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ steps.vars.outputs.TAG }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish both tested architectures under the image tag
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          amd64=$(cat "$RUNNER_TEMP/digests/amd64.txt")
          arm64=$(cat "$RUNNER_TEMP/digests/arm64.txt")
          test -n "$amd64"
          test -n "$arm64"
          docker buildx imagetools create --tag "poldixd/php:$TAG" \
            "poldixd/php@$amd64" "poldixd/php@$arm64"

  checks:
    name: Image checks
    if: always()
    needs: [changes, docker, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected builds succeeded
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          BUILD_RESULT: ${{ needs.docker.result }}
          PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
          if [ "$PUBLISH_IMAGES" = true ]; then
            test "$PUBLISH_RESULT" = success
          else
            test "$PUBLISH_RESULT" = skipped
          fi
