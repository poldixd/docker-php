name: ci

on:
  push:
    branches: ['main']
  pull_request:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; serialize main-branch publications.
concurrency:
  group: php-images-${{ github.event_name == 'pull_request' && 'pr' || 'publish' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select image builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test build selection
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Select affected PHP versions
        id: select
        run: python3 -B .github/scripts/select_builds.py

  docker:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        env:
          PHP_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "chromium" ]; then
            echo "TAG=$PHP_VERSION-chromium" >> "$GITHUB_OUTPUT"
            echo "INSTALL_CHROMIUM=true" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=$PHP_VERSION" >> "$GITHUB_OUTPUT"
            echo "INSTALL_CHROMIUM=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, test both architectures, and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: php/${{ matrix.version }}/Dockerfile
          target: test
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          # Re-run tests even when the runtime layers are cached.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime,test' || 'test' }}
          build-args: |
            INSTALL_CHROMIUM=${{ steps.vars.outputs.INSTALL_CHROMIUM }}
          tags: poldixd/php:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha,scope=php-${{ matrix.version }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.version }}-${{ matrix.variant }}

  checks:
    name: Image checks
    if: always()
    needs: [changes, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected builds succeeded
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          BUILD_RESULT: ${{ needs.docker.result }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$HAS_CHANGES" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$BUILD_RESULT" = skipped
          fi
